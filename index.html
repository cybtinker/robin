<style>
/* Layout: one narrow column, like a pocket recorder: take, age dial, playback, speed log. */
:root {
  --bg: #f3efe8;        /* warm paper */
  --panel: #fffdf9;
  --ink: #1d1a20;
  --muted: #6d6670;
  --line: #e2dbd0;
  --rec: #d6402e;       /* REC lamp */
  --young: #1f7a6d;     /* younger: fresh teal */
  --old: #a4651b;       /* older: patina amber */
  --now: #2f8f3e;       /* original-age contour: green */
  --accent: var(--young);
  --display: ui-rounded, "SF Pro Rounded", -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
  --body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16141a; --panel: #211e26; --ink: #f1ece6; --muted: #a39aa6; --line: #34303a;
    --rec: #f0604c; --young: #4cc2ae; --old: #e0a050; --now: #5fcf6e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16141a; --panel: #211e26; --ink: #f1ece6; --muted: #a39aa6; --line: #34303a;
  --rec: #f0604c; --young: #4cc2ae; --old: #e0a050; --now: #5fcf6e; color-scheme: dark;
}
:root.older { --accent: var(--old); }

/* One phone screen, no page scroll: header, Sing, Age, Help; the Listen bar is pinned at the bottom. */
:root { --young-soft: color-mix(in srgb, var(--young) 12%, var(--panel)); }
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 var(--body);
  -webkit-text-size-adjust: 100%; overflow: hidden;
}
[hidden] { display: none !important; }
p { margin: 0; }
button { font: inherit; color: inherit; }
.app {
  height: 100vh; height: 100dvh; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
}
.content {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  padding: 12px max(16px, env(safe-area-inset-left, 0px)) 8px max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 10px;
}
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 12px; }

/* header */
header { display: flex; align-items: center; gap: 8px; position: relative; }
header::after { content: ""; position: absolute; right: 0; top: -12px; width: 136px; height: 12px; background: var(--deco) repeat-x left center / auto 12px; opacity: .8; pointer-events: none; }
.bird { width: 52px; height: 44px; flex: none; margin: -4px -2px -2px -4px; color: var(--accent); overflow: visible; }
.bird .notes g { animation: note 2.4s ease-in-out infinite; transform-box: fill-box; }
.bird .notes g:nth-child(2) { animation-delay: .6s; }
@keyframes note { 0%, 100% { transform: translateY(0); opacity: .9; } 50% { transform: translateY(-3px); opacity: .5; } }
:root[data-theme="dark"] .bird, :root[data-theme="christmas"] .bird { filter: drop-shadow(0 0 1px rgba(255,255,255,.55)); }
@media (prefers-color-scheme: dark) { :root:not([data-theme]) .bird { filter: drop-shadow(0 0 1px rgba(255,255,255,.55)); } }
.brand { flex: 1; min-width: 0; display: flex; flex-direction: column; }
h1 { margin: 0; font: 700 22px/1.1 var(--display); }
.tagline { font-size: 12px; line-height: 1.25; color: var(--young); font-weight: 600; }
.icobtn { position: relative; width: 40px; height: 40px; flex: none; border-radius: 20px; border: 1px solid var(--line); background: var(--panel);

  <button type="button" id="playOrig" disabled><svg class="play" width="14" height="14" viewBox="0 0 24 24" fill="var(--old)" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg><svg class="pause" width="14" height="14" viewBox="0 0 24 24" fill="var(--old)" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg><span data-i18n="playOrig">Original</span></button>
  <button type="button" id="playFx" disabled><svg class="play" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg><svg class="pause" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg><span id="fxLabel"></span></button>
  <button type="button" id="shareBtn" disabled data-i18n-aria="share" aria-label="Save or share"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M5 13v7h14v-7"/></svg></button>
  <audio id="origAudio" preload="auto" hidden></audio>
  <audio id="fxAudio" preload="auto" hidden></audio>
</nav>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<dialog id="settings" aria-labelledby="setT">
  <form method="dialog" class="dlg">
    <h2 id="setT" data-i18n="settings">Settings</h2>
    <label class="check"><input type="checkbox" id="nsBox"> <span data-i18n="noise">Phone noise reduction</span></label>
    <h3 data-i18n="cuesSummary">Fine-tune each texture cue</h3>
    <p class="hint" data-i18n="info_cues"></p>
    <div class="cues" id="cues"></div>
    <h3 data-i18n="speedH">Speed on this device</h3>
    <table><tbody>
      <tr><td data-i18n="sLen">Length of take</td><td id="sLen">–</td></tr>
      <tr><td data-i18n="sAna">Reading the voice (once per take)</td><td id="sAna">–</td></tr>
      <tr><td data-i18n="sFx">Applying the age effect</td><td id="sFx">–</td></tr>
      <tr><td data-i18n="sRt">Total, as a share of take length</td><td id="sRt">–</td></tr>
    </tbody></table>
    <div class="row"><button class="btn" type="button" id="copyBtn" data-i18n="copy">Copy speed report</button><span class="hint" id="copyNote"></span></div>
    <footer>
      <p id="foot1" data-i18n="foot1"></p>
      <p data-i18n="foot2"></p>
      <p><span id="rsId"></span> · <span id="ver"></span></p>
    </footer>
    <div class="row end"><button class="btn primary" value="close" data-i18n="done">Done</button></div>
  </form>
</dialog>

<dialog id="review" aria-labelledby="rvTitle">
  <form method="dialog" class="dlg">
    <h2 id="rvTitle" data-i18n="rvTitle">Check before sending</h2>
    <p class="hint" data-i18n="rvIntro"></p>
    <p><span id="rvFiles"></span><br><span id="rvId" class="hint"></span></p>
    <div class="rv-table"><table><thead><tr><th data-i18n="rvTime"></th><th data-i18n="rvSettings"></th><th></th></tr></thead><tbody id="rvRows"></tbody></table></div>
    <details><summary data-i18n="rvShowCsv"></summary><pre id="rvCsv"></pre></details>
    <audio id="rvAudio" hidden></audio>
    <div class="row end"><button class="btn" value="cancel" data-i18n="rvCancel">Cancel</button><button class="btn primary" value="ok" id="rvOk" data-i18n="rvOk">Looks fine, send it</button></div>
  </form>
</dialog>
<script src="i18n.js"></script>
<script src="research.js"></script>
<script src="app.js"></script>
</body>
</html>
